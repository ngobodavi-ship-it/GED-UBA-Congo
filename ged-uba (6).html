<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GED UBA Congo — Numérisation des documents bancaires</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap');
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background:#F5F6F8; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background:#d4d6db; border-radius:8px; }
    .disp { font-family:'Sora', sans-serif; }
    select { -webkit-appearance:none; appearance:none; }
  </style>
</head>
<body>
  <div id="root"><div style="padding:40px;color:#888;font-family:sans-serif">Chargement de l'application…</div></div>

  <script type="text/babel">
  try {
    const { useState, useMemo, useEffect, useRef } = React;

    /* ====== Stockage fichiers : IndexedDB + cache mémoire ====== */
    const fileCache = new Map();
    const DB_NAME = "ged_uba_db", STORE = "files";
    function idbOpen() { return new Promise((res, rej) => { try { const r = indexedDB.open(DB_NAME, 1); r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); }
    async function idbPut(key, blob) { try { const db = await idbOpen(); return await new Promise((res) => { const tx = db.transaction(STORE, "readwrite"); tx.objectStore(STORE).put(blob, key); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }); } catch (e) { return false; } }
    async function idbGet(key) { try { const db = await idbOpen(); return await new Promise((res) => { const tx = db.transaction(STORE, "readonly"); const rq = tx.objectStore(STORE).get(key); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null); }); } catch (e) { return null; } }
    async function idbDel(key) { try { const db = await idbOpen(); return await new Promise((res) => { const tx = db.transaction(STORE, "readwrite"); tx.objectStore(STORE).delete(key); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }); } catch (e) { return false; } }
    async function idbClear() { try { const db = await idbOpen(); return await new Promise((res) => { const tx = db.transaction(STORE, "readwrite"); tx.objectStore(STORE).clear(); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }); } catch (e) { return false; } }

    /* ====== Nomenclature & exports (livrables) ====== */
    function stripAccents(s) { return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
    function nomenclatureBase(d) { const c = stripAccents(d.numeroCompte || "").replace(/[^A-Za-z0-9]/g, ""); const n = stripAccents(d.nomClient || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); return (c || "COMPTE") + "_" + (n || "CLIENT"); }
    function nomLivrable(d) { return nomenclatureBase(d) + ".pdf"; }
    function downloadBlob(blob, name) { const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); }
    async function downloadDoc(doc) {
      let blob = fileCache.get(doc.id); if (!blob) blob = await idbGet(doc.id);
      let ext = ".pdf"; if (doc.nomFichier && /\.[a-z0-9]+$/i.test(doc.nomFichier)) ext = doc.nomFichier.match(/\.[a-z0-9]+$/i)[0];
      let filename = nomenclatureBase(doc) + ext;
      if (!blob) { const txt = "Document GED UBA (exemple)\nN° compte: "+doc.numeroCompte+"\nClient: "+doc.nomClient+"\nDate ouverture: "+doc.dateOuverture+"\nType: "+typeOf(doc.typeClient).label+"\n"; blob = new Blob([txt], { type: "text/plain" }); filename = nomenclatureBase(doc) + ".txt"; }
      downloadBlob(blob, filename);
    }
    function exportIndexCSV(docs) {
      const sep = ";"; const head = ["NumeroCompte","Nom_Raison_Sociale","Date_Ouverture","Type_Client","Fichier_PDFA","Agence","Mode","OCR","Format","Date_Numerisation","Statut"];
      const esc = (s) => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
      const lines = [head.join(sep)];
      docs.forEach((d) => { lines.push([d.numeroCompte, esc(d.nomClient), d.dateOuverture, typeOf(d.typeClient).label, nomLivrable(d), esc(d.agence), d.mode || "", d.ocr ? "Oui" : "Non", d.format || "PDF/A", new Date(d.date).toISOString(), STATUTS[d.statut].label].join(sep)); });
      downloadBlob(new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" }), "index_global_UBA.csv");
    }
    function exportIndexXML(docs) {
      const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<conventions>\n';
      docs.forEach((d) => { xml += "  <convention>\n    <numeroCompte>"+esc(d.numeroCompte)+"</numeroCompte>\n    <nomClient>"+esc(d.nomClient)+"</nomClient>\n    <dateOuverture>"+esc(d.dateOuverture)+"</dateOuverture>\n    <typeClient>"+esc(typeOf(d.typeClient).label)+"</typeClient>\n    <fichier>"+esc(nomLivrable(d))+"</fichier>\n    <agence>"+esc(d.agence)+"</agence>\n    <statut>"+esc(STATUTS[d.statut].label)+"</statut>\n  </convention>\n"; });
      xml += "</conventions>\n";
      downloadBlob(new Blob([xml], { type: "application/xml;charset=utf-8" }), "index_global_UBA.xml");
    }
    function exportRapportJournalier(docs) {
      const sep = ";"; const today = new Date().toLocaleDateString("fr-FR");
      const lines = ["Rapport journalier de production - UBA Congo", "Date" + sep + today, "", "Indicateur" + sep + "Valeur", "Total documents" + sep + docs.length];
      Object.entries(STATUTS).forEach(([k, v]) => lines.push(v.label + sep + docs.filter((d) => d.statut === k).length));
      CLIENT_TYPES.forEach((t) => lines.push("Type " + t.label + sep + docs.filter((d) => d.typeClient === t.id).length));
      lines.push("Anomalies (rejetes)" + sep + docs.filter((d) => d.statut === "rejete").length);
      downloadBlob(new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" }), "rapport_journalier_" + new Date().toISOString().slice(0, 10) + ".csv");
    }

    /* ====== Icônes ====== */
    const ICONS = {
      dashboard: <><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></>,
      scan: <><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M5 12h14"/></>,
      file: <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></>,
      search: <><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></>,
      archive: <><path d="M21 8v13H3V8"/><rect x="1" y="3" width="22" height="5" rx="1"/><path d="M10 12h4"/></>,
      barchart: <><path d="M3 3v18h18"/><path d="M7 16v-5"/><path d="M12 16V8"/><path d="M17 16v-9"/></>,
      settings: <><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M1 14h6"/><path d="M9 8h6"/><path d="M17 16h6"/></>,
      upload: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></>,
      check: <><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></>,
      sparkle: <><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></>,
      clock: <><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></>,
      shield: <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></>,
      trending: <><path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></>,
      building: <><rect x="4" y="2" width="16" height="20" rx="1"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M12 6h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M12 10h.01"/><path d="M16 10h.01"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/></>,
      bank: <><path d="M3 21h18"/><path d="M3 10h18"/><path d="M5 6l7-3 7 3"/><path d="M4 10v11"/><path d="M20 10v11"/><path d="M8 10v11"/><path d="M12 10v11"/><path d="M16 10v11"/></>,
      user: <><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
      folder: <><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></>,
      chevron: <><path d="M9 18l6-6-6-6"/></>,
      chevronleft: <><path d="M15 18l-6-6 6-6"/></>,
      chevrondown: <><path d="M6 9l6 6 6-6"/></>,
      download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></>,
      eye: <><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>,
      trash: <><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></>,
      x: <><path d="M18 6L6 18"/><path d="M6 6l12 12"/></>,
    };
    function Icon({ name, size = 18, color = "currentColor", className = "", strokeWidth = 2 }) { return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>{ICONS[name]}</svg>); }

    /* ====== Graphiques ====== */
    function Donut({ data, size = 150, thickness = 24 }) {
      const total = data.reduce((s, d) => s + d.value, 0); let acc = 0;
      const stops = total > 0 ? data.map((d) => { const start = (acc/total)*360; acc += d.value; const end = (acc/total)*360; return d.color+" "+start+"deg "+end+"deg"; }).join(", ") : "#e5e7eb 0deg 360deg";
      return (<div style={{ width: size, height: size, borderRadius: "50%", background: "conic-gradient("+stops+")", position: "relative", margin: "0 auto" }}><div style={{ position: "absolute", top: thickness, left: thickness, right: thickness, bottom: thickness, background: "#fff", borderRadius: "50%" }} /></div>);
    }
    function VBars({ data, valueKey, labelKey, color, colorKey, height = 220 }) {
      const max = Math.max.apply(null, data.map((d) => d[valueKey]).concat([1]));
      return (<div style={{ height }} className="flex items-end gap-3 pt-2">{data.map((d, i) => (<div key={i} className="flex h-full flex-1 flex-col items-center justify-end"><div className="mb-1 text-[10px] font-semibold text-black/40">{d[valueKey]}</div><div className="w-full rounded-t-md transition-all" style={{ height: (d[valueKey]/max*100)+"%", minHeight: 4, background: colorKey ? d[colorKey] : color }} /><div className="mt-2 text-[11px] text-black/45 text-center leading-tight">{d[labelKey]}</div></div>))}</div>);
    }
    function AreaChartSimple({ data, color, height = 220 }) {
      const w = 600, h = height - 28; const max = Math.max.apply(null, data.map((d) => d.docs).concat([1]));
      const pts = data.map((d, i) => [(i/(data.length-1))*w, h - (d.docs/max)*(h-16) - 8]);
      const line = pts.map((p, i) => (i ? "L" : "M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
      const area = line + " L "+w+" "+h+" L 0 "+h+" Z";
      return (<div><svg viewBox={"0 0 "+w+" "+h} width="100%" height={h} preserveAspectRatio="none"><defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.35" /><stop offset="100%" stopColor={color} stopOpacity="0" /></linearGradient></defs><path d={area} fill="url(#grad)" /><path d={line} fill="none" stroke={color} strokeWidth="3" strokeLinejoin="round" />{pts.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="4" fill="#fff" stroke={color} strokeWidth="2.5" />)}</svg><div className="flex justify-between px-1 pt-2">{data.map((d, i) => <span key={i} className="text-[11px] text-black/45">{d.jour}</span>)}</div></div>);
    }

    /* ====== Constantes ====== */
    const UBA_RED = "#C8102E"; const INK = "#1A1A1E"; const STORAGE_KEY = "ged_uba_docs_v4";
    const CLIENT_TYPES = [
      { id: "particulier", label: "Particulier", icon: "user", color: "#C8102E" },
      { id: "professionnel", label: "Professionnel", icon: "building", color: "#1E6091" },
      { id: "institutionnel", label: "Institutionnel", icon: "bank", color: "#2A9D8F" },
    ];
    const typeOf = (id) => CLIENT_TYPES.find((t) => t.id === id) || CLIENT_TYPES[0];
    const AGENCES = ["Brazzaville — Siège", "Brazzaville — Poto-Poto", "Pointe-Noire — Centre", "Pointe-Noire — Loandjili"];
    const STATUTS = {
      numerise: { label: "Numérisé", color: "#2A9D8F", bg: "#E6F4F1" },
      controle: { label: "En contrôle", color: "#E09F3E", bg: "#FCF3E3" },
      archive: { label: "Archivé", color: "#1E6091", bg: "#E5EFF6" },
      rejete: { label: "Rejeté", color: "#C8102E", bg: "#FBE7EA" },
    };
    const NOMS_PART = ["MABIALA Jean", "NGOMA Sarah", "OKEMBA Patrick", "LOEMBA Chancelle", "BOUITY André", "MOUANDA Grâce", "TCHICAYA Rolf", "KIMBEMBE Aline"];
    const NOMS_PRO = ["SARL CONGO TELECOM", "ETS NGANGA & FILS", "SOCIÉTÉ BTP DELTA", "PHARMACIE LA GRÂCE", "GARAGE AUTO 242", "BOULANGERIE LE PAIN D'OR"];
    const NOMS_INST = ["MINISTÈRE DES FINANCES", "MAIRIE DE BRAZZAVILLE", "UNIVERSITÉ M. NGOUABI", "TRÉSOR PUBLIC", "CNSS CONGO"];
    function nomPour(type) { if (type === "professionnel") return NOMS_PRO[Math.floor(Math.random()*NOMS_PRO.length)]; if (type === "institutionnel") return NOMS_INST[Math.floor(Math.random()*NOMS_INST.length)]; return NOMS_PART[Math.floor(Math.random()*NOMS_PART.length)]; }
    function numCompte() { let s = "300" + (11+Math.floor(Math.random()*8)); for (let i = 0; i < 8; i++) s += Math.floor(Math.random()*10); return s; }

    function genDocs(n) {
      const types = CLIENT_TYPES.map((t) => t.id); const stKeys = Object.keys(STATUTS); const out = [];
      for (let i = 0; i < n; i++) {
        const type = types[Math.floor(Math.random()*types.length)]; const st = stKeys[Math.floor(Math.random()*stKeys.length)];
        const dNum = new Date(2026, 5, 1+Math.floor(Math.random()*4), Math.floor(Math.random()*24), Math.floor(Math.random()*60));
        const dOuv = new Date(2015+Math.floor(Math.random()*11), Math.floor(Math.random()*12), 1+Math.floor(Math.random()*28));
        out.push({ id: "DOC-"+(104820+i), nomFichier: "scan_"+(104820+i)+".pdf", numeroCompte: numCompte(), nomClient: nomPour(type), dateOuverture: dOuv.toISOString().slice(0,10), typeClient: type, agence: AGENCES[Math.floor(Math.random()*AGENCES.length)], statut: st, pages: 1+Math.floor(Math.random()*8), taille: (0.3+Math.random()*4).toFixed(1)+" Mo", date: dNum.toISOString(), thumb: null, fileType: "application/pdf", mode: Math.random()>0.5?"Couleur":"Niveaux de gris", ocr: true, format: "PDF/A", ocrText: "" });
      }
      return out.sort((a, b) => new Date(b.date) - new Date(a.date));
    }
    function loadDocs() { try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {} return genDocs(48); }
    const fmtDate = (iso) => { const d = new Date(iso); return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" }) + " · " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); };
    const frDate = (ymd) => { if (!ymd) return "—"; const p = ymd.split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : ymd; };
    const fmtSize = (b) => { if (b < 1024) return b+" o"; if (b < 1048576) return (b/1024).toFixed(0)+" Ko"; return (b/1048576).toFixed(1)+" Mo"; };

    function makeThumb(file) {
      return new Promise((resolve) => {
        if (!file.type || file.type.indexOf("image/") !== 0) { resolve(null); return; }
        const reader = new FileReader();
        reader.onload = (e) => { const img = new Image(); img.onload = () => { const max = 480; const scale = Math.min(1, max/Math.max(img.width, img.height)); const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale)); const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h); try { resolve(c.toDataURL("image/jpeg", 0.6)); } catch (err) { resolve(null); } }; img.onerror = () => resolve(null); img.src = e.target.result; };
        reader.onerror = () => resolve(null); reader.readAsDataURL(file);
      });
    }

    /* ====== Champs ====== */
    function Field({ label, value, onChange, type = "text", required, invalid, placeholder, readOnly }) {
      return (<div><label className="mb-1 block text-xs font-medium text-black/45">{label}{required && <span className="text-[#C8102E]"> *</span>}</label><input type={type} value={value} onChange={(e) => onChange && onChange(e.target.value)} placeholder={placeholder} readOnly={readOnly} className={"w-full rounded-xl border bg-white px-3 py-2.5 text-sm outline-none " + (invalid ? "border-[#C8102E] bg-[#FFF6F7]" : "border-black/10") + (readOnly ? " text-black/50" : "")} /></div>);
    }
    function Select({ label, value, onChange, options, required, invalid }) {
      return (<div><label className="mb-1 block text-xs font-medium text-black/45">{label}{required && <span className="text-[#C8102E]"> *</span>}</label><div className="relative"><select value={value} onChange={(e) => onChange(e.target.value)} className={"w-full rounded-xl border bg-white px-3 py-2.5 text-sm outline-none " + (invalid ? "border-[#C8102E]" : "border-black/10")}>{options.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}</select><span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-black/30"><Icon name="chevrondown" size={16} /></span></div></div>);
    }
    function Check({ label, checked, onChange, locked }) {
      return (<label className={"flex items-center gap-2 text-sm " + (locked ? "" : "cursor-pointer")}><input type="checkbox" checked={checked} disabled={locked} onChange={(e) => onChange(e.target.checked)} className="h-4 w-4 accent-[#C8102E]" /><span className="text-black/70">{label}</span></label>);
    }

    /* ====== App ====== */
    function App() {
      const [view, setView] = useState("dashboard");
      const [collapsed, setCollapsed] = useState(false);
      const [docs, setDocs] = useState(loadDocs);
      const [query, setQuery] = useState("");
      const [typeFilter, setTypeFilter] = useState("all");
      const [preview, setPreview] = useState(null);
      const [toast, setToast] = useState("");

      useEffect(() => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(docs)); } catch (e) { console.warn("Stockage local saturé.", e); } }, [docs]);
      function notify(msg) { setToast(msg); setTimeout(() => setToast(""), 2800); }
      const addDocs = (arr) => setDocs((cur) => [...arr, ...cur]);
      function validateDoc(id) { setDocs((cur) => cur.map((d) => d.id === id ? { ...d, statut: "archive" } : d)); notify("Document validé et archivé."); }
      function deleteDoc(id) { setDocs((cur) => cur.filter((d) => d.id !== id)); fileCache.delete(id); idbDel(id); notify("Document supprimé."); }

      const totalProjet = 565000;
      const numerisesCumul = 248130 + docs.filter((d) => d.statut !== "rejete").length;
      const stats = useMemo(() => ({
        parType: CLIENT_TYPES.map((t) => ({ name: t.label, value: docs.filter((d) => d.typeClient === t.id).length, color: t.color })),
        parStatut: Object.entries(STATUTS).map(([k, v]) => ({ key: k, label: v.label, value: docs.filter((d) => d.statut === k).length, color: v.color })),
        indexes: docs.filter((d) => d.numeroCompte && d.nomClient && d.dateOuverture && d.typeClient).length,
      }), [docs]);
      const cadence = [{ jour: "Lun", docs: 1240 },{ jour: "Mar", docs: 1890 },{ jour: "Mer", docs: 2310 },{ jour: "Jeu", docs: 2050 },{ jour: "Ven", docs: 2680 },{ jour: "Sam", docs: 980 }];

      function resetData() { if (window.confirm("Réinitialiser toutes les données de test ? (fichiers importés inclus)")) { idbClear(); fileCache.clear(); setDocs(genDocs(48)); notify("Données réinitialisées."); } }

      const filtered = useMemo(() => docs.filter((d) => {
        const matchType = typeFilter === "all" || d.typeClient === typeFilter; const q = query.trim().toLowerCase();
        const matchQ = !q || (d.nomClient||"").toLowerCase().includes(q) || (d.numeroCompte||"").toLowerCase().includes(q) || d.id.toLowerCase().includes(q) || (d.agence||"").toLowerCase().includes(q) || (d.ocrText||"").toLowerCase().includes(q);
        return matchType && matchQ;
      }), [docs, query, typeFilter]);

      const NAV = [
        { id: "dashboard", label: "Tableau de bord", icon: "dashboard" },
        { id: "numerisation", label: "Numérisation", icon: "scan" },
        { id: "documents", label: "Documents", icon: "file" },
        { id: "recherche", label: "Recherche", icon: "search" },
        { id: "archives", label: "Archives", icon: "archive" },
        { id: "rapports", label: "Qualité & Livrables", icon: "barchart" },
      ];

      return (
        <div className="flex h-screen w-full overflow-hidden bg-[#F5F6F8] text-[#1A1A1E]">
          <aside className={"flex flex-col bg-[#15151A] text-white transition-all duration-300 " + (collapsed ? "w-[76px]" : "w-[248px]")}>
            <div className={"flex items-center gap-3 border-b border-white/10 py-5 " + (collapsed ? "justify-center px-0" : "px-5")}><div className="flex h-10 w-10 items-center justify-center rounded-lg" style={{ background: UBA_RED }}><span className="disp text-lg font-extrabold tracking-tight">U</span></div>{!collapsed && (<div className="leading-tight"><div className="disp text-[15px] font-bold">UBA · GED</div><div className="text-[10px] uppercase tracking-widest text-white/40">Documents bancaires</div></div>)}</div>
            <button onClick={() => setCollapsed(!collapsed)} title={collapsed ? "Agrandir le menu" : "Réduire le menu"} className={"mx-3 mt-3 mb-1 flex items-center rounded-lg py-2 text-white/50 hover:bg-white/5 hover:text-white " + (collapsed ? "justify-center px-0" : "justify-start px-3")}><Icon name={collapsed ? "chevron" : "chevronleft"} size={18} />{!collapsed && <span className="ml-2 text-xs font-medium">Réduire le menu</span>}</button>
            <nav className="flex-1 px-3 py-2">{NAV.map((n) => { const active = view === n.id; return (<button key={n.id} onClick={() => setView(n.id)} title={n.label} className={"mb-1 flex w-full items-center gap-3 rounded-lg py-2.5 text-sm transition-all " + (collapsed ? "justify-center px-0" : "px-3") + (active ? " text-white" : " text-white/55 hover:text-white hover:bg-white/5")} style={active ? { background: UBA_RED } : {}}><Icon name={n.icon} size={18} />{!collapsed && <span className="font-medium">{n.label}</span>}{!collapsed && active && <Icon name="chevron" size={16} className="ml-auto" />}</button>); })}</nav>
            {!collapsed && (<div className="mx-3 mb-3 rounded-xl bg-white/5 p-4"><div className="mb-1 text-[11px] uppercase tracking-wide text-white/40">Objectif projet</div><div className="disp text-xl font-bold">565 000</div><div className="text-[11px] text-white/50">conventions à numériser</div><div className="mt-3 h-1.5 w-full overflow-hidden rounded-full bg-white/10"><div className="h-full rounded-full" style={{ width: ((numerisesCumul/totalProjet)*100)+"%", background: UBA_RED }} /></div><div className="mt-1.5 text-[11px] text-white/60">{numerisesCumul.toLocaleString("fr-FR")} traités · échéance 31 août 2026</div></div>)}
            <button onClick={resetData} title="Réinitialiser les données" className={"flex items-center gap-3 border-t border-white/10 py-4 text-sm text-white/50 hover:text-white " + (collapsed ? "justify-center px-0" : "px-5")}><Icon name="settings" size={18} />{!collapsed && <span>Réinitialiser les données</span>}</button>
          </aside>

          <main className="flex flex-1 flex-col overflow-hidden">
            <header className="flex items-center justify-between border-b border-black/5 bg-white px-7 py-4"><div><div className="disp text-[19px] font-bold capitalize">{NAV.find((n) => n.id === view)?.label}</div><div className="text-xs text-black/40">UBA Congo — Brazzaville &amp; Pointe-Noire</div></div><div className="flex items-center gap-3"><div className="hidden items-center gap-2 rounded-lg bg-[#F5F6F8] px-3 py-2 md:flex"><Icon name="search" size={15} color="#bbb" /><input value={query} onChange={(e) => setQuery(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") setView("recherche"); }} placeholder="N° compte, client… puis Entrée" className="w-56 bg-transparent text-sm outline-none placeholder:text-black/30" /></div><div className="flex h-9 w-9 items-center justify-center rounded-full text-sm font-bold text-white" style={{ background: UBA_RED }}>GC</div></div></header>
            <div className="flex-1 overflow-y-auto p-7">
              {view === "dashboard" && <Dashboard numerisesCumul={numerisesCumul} totalProjet={totalProjet} docs={docs} stats={stats} cadence={cadence} onScan={() => setView("numerisation")} />}
              {view === "numerisation" && <Numerisation recent={docs.slice(0, 6)} onAddDocs={addDocs} onNotify={notify} />}
              {(view === "documents" || view === "recherche") && <DocsTable docs={filtered} typeFilter={typeFilter} setTypeFilter={setTypeFilter} query={query} setQuery={setQuery} onPreview={setPreview} onDelete={deleteDoc} searchMode={view === "recherche"} />}
              {view === "archives" && <DocsTable docs={filtered.filter((d) => d.statut === "archive")} typeFilter={typeFilter} setTypeFilter={setTypeFilter} query={query} setQuery={setQuery} onPreview={setPreview} onDelete={deleteDoc} />}
              {view === "rapports" && <Rapports stats={stats} cadence={cadence} numerisesCumul={numerisesCumul} docs={docs} onNotify={notify} />}
            </div>
          </main>
          {preview && <PreviewModal doc={preview} onClose={() => setPreview(null)} onValidate={validateDoc} onDelete={deleteDoc} />}
          {toast && <div className="fixed bottom-6 left-1/2 z-[60] -translate-x-1/2 rounded-xl bg-[#15151A] px-5 py-3 text-sm font-medium text-white shadow-2xl">{toast}</div>}
        </div>
      );
    }

    function Dashboard({ numerisesCumul, totalProjet, docs, stats, cadence, onScan }) {
      const kpis = [
        { label: "Documents numérisés (cumul)", value: numerisesCumul.toLocaleString("fr-FR"), icon: "file", color: "#C8102E", sub: "+3 280 aujourd'hui" },
        { label: "Avancement du projet", value: Math.round((numerisesCumul/totalProjet)*100)+" %", icon: "trending", color: "#2A9D8F", sub: "objectif 565 000" },
        { label: "Exactitude indexation", value: "99,9 %", icon: "check", color: "#E09F3E", sub: "cible ≥ 99,9 %" },
        { label: "Taux d'erreur image", value: "0,3 %", icon: "shield", color: "#1E6091", sub: "toléré < 0,5 %" },
      ];
      return (
        <div className="space-y-6">
          <div className="grid grid-cols-2 gap-4 lg:grid-cols-4">{kpis.map((k) => (<div key={k.label} className="rounded-2xl border border-black/5 bg-white p-5 shadow-sm"><div className="mb-3 flex h-10 w-10 items-center justify-center rounded-xl" style={{ background: k.color+"1A" }}><Icon name={k.icon} size={20} color={k.color} /></div><div className="disp text-2xl font-bold">{k.value}</div><div className="mt-1 text-xs font-medium text-black/45">{k.label}</div><div className="mt-2 text-[11px]" style={{ color: k.color }}>{k.sub}</div></div>))}</div>
          <div className="grid grid-cols-1 gap-4 lg:grid-cols-3">
            <div className="rounded-2xl border border-black/5 bg-white p-6 shadow-sm lg:col-span-2"><div className="mb-4 flex items-center justify-between"><div className="disp font-bold">Cadence de numérisation</div><span className="text-xs text-black/40">cible : 8 000 / jour ouvré</span></div><AreaChartSimple data={cadence} color={UBA_RED} /></div>
            <div className="rounded-2xl border border-black/5 bg-white p-6 shadow-sm"><div className="disp mb-4 font-bold">Répartition par type de client</div><Donut data={stats.parType} /><div className="mt-4 space-y-1.5">{stats.parType.map((c) => (<div key={c.name} className="flex items-center gap-2 text-xs"><span className="h-2.5 w-2.5 rounded-full" style={{ background: c.color }} /><span className="text-black/60">{c.name}</span><span className="ml-auto font-semibold">{c.value}</span></div>))}</div></div>
          </div>
          <button onClick={onScan} className="flex w-full items-center justify-center gap-2 rounded-2xl py-4 text-sm font-semibold text-white shadow-lg transition-transform hover:scale-[1.01]" style={{ background: UBA_RED }}><Icon name="scan" size={18} /> Indexer et numériser une convention</button>
        </div>
      );
    }

    /* ====== NUMÉRISATION + assistant OCR ====== */
    function Numerisation({ recent, onAddDocs, onNotify }) {
      const inputRef = useRef(null); const ocrInputRef = useRef(null);
      const [drag, setDrag] = useState(false);
      const [importing, setImporting] = useState(false);
      const [batch, setBatch] = useState(0); const [done, setDone] = useState(0);
      const [attempted, setAttempted] = useState(false);
      const [numeroCompte, setNumeroCompte] = useState("");
      const [nomClient, setNomClient] = useState("");
      const [dateOuverture, setDateOuverture] = useState("");
      const [typeClient, setTypeClient] = useState("particulier");
      const [agence, setAgence] = useState(AGENCES[0]);
      const [mode, setMode] = useState("Couleur");
      const [crop, setCrop] = useState(true); const [deskew, setDeskew] = useState(true); const [blank, setBlank] = useState(true);
      // OCR
      const [ocrBusy, setOcrBusy] = useState(false); const [ocrProgress, setOcrProgress] = useState(0);
      const [ocrImg, setOcrImg] = useState(null); const [ocrText, setOcrText] = useState("");

      const errCompte = attempted && !numeroCompte.trim();
      const errNom = attempted && !nomClient.trim();
      const errDate = attempted && !dateOuverture;
      const valid = numeroCompte.trim() && nomClient.trim() && dateOuverture && typeClient;

      function applyOcr(text) {
        const nums = text.match(/\d[\d ]{7,}\d/g) || text.match(/\d{8,}/g) || [];
        let best = ""; nums.forEach((x) => { const d = x.replace(/\D/g, ""); if (d.length > best.length) best = d; });
        if (best) setNumeroCompte(best);
        const m = text.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
        if (m) { let y = m[3]; if (y.length === 2) y = "20" + y; setDateOuverture(y + "-" + ("0"+m[2]).slice(-2) + "-" + ("0"+m[1]).slice(-2)); }
        const low = stripAccents(text.toLowerCase());
        if (/(ministere|mairie|tresor|cnss|universite|prefecture|etat|public)/.test(low)) setTypeClient("institutionnel");
        else if (/(sarl|societe|entreprise|\bets\b|etablissement|\bsas\b|rccm|raison sociale)/.test(low)) setTypeClient("professionnel");
      }
      async function runOcr(file) {
        if (typeof Tesseract === "undefined") { onNotify("Module OCR non disponible (connexion internet requise)."); return; }
        setOcrBusy(true); setOcrProgress(0);
        const thumb = await makeThumb(file); setOcrImg(thumb || null);
        try {
          const res = await Tesseract.recognize(file, "fra", { logger: (mm) => { if (mm.status === "recognizing text") setOcrProgress(Math.round(mm.progress * 100)); } });
          const text = (res && res.data && res.data.text) || "";
          setOcrText(text); applyOcr(text);
          onNotify("OCR terminé — champs pré-remplis, vérifiez-les.");
        } catch (e) { console.error(e); onNotify("Échec de l'OCR. Saisie manuelle nécessaire."); }
        setOcrBusy(false);
      }
      function onOcrPick(e) { const f = e.target.files && e.target.files[0]; if (f) runOcr(f); e.target.value = ""; }

      function tryOpen() { if (!valid) { setAttempted(true); onNotify("Renseignez les 4 critères d'indexation obligatoires."); return; } inputRef.current && inputRef.current.click(); }
      async function handleFiles(fileList) {
        if (!valid) { setAttempted(true); onNotify("Renseignez les 4 critères d'indexation obligatoires."); return; }
        const files = Array.prototype.slice.call(fileList || []); if (!files.length) return;
        setImporting(true); setBatch(files.length); setDone(0);
        const created = [];
        for (let i = 0; i < files.length; i++) {
          const f = files[i]; const thumb = await makeThumb(f); const id = "DOC-" + Date.now() + "-" + i;
          fileCache.set(id, f); idbPut(id, f);
          created.push({ id: id, nomFichier: f.name, numeroCompte: numeroCompte.trim(), nomClient: nomClient.trim(), dateOuverture: dateOuverture, typeClient: typeClient, agence: agence, statut: "numerise", pages: null, taille: fmtSize(f.size), date: new Date().toISOString(), thumb: thumb, fileType: f.type || "fichier", mode: mode, ocr: true, format: "PDF/A", ocrText: ocrText || "" });
          setDone(i + 1);
        }
        onAddDocs(created); setImporting(false);
        onNotify(created.length + " fichier(s) indexé(s) et importé(s).");
        setNumeroCompte(""); setNomClient(""); setDateOuverture(""); setAttempted(false); setOcrImg(null); setOcrText("");
      }
      function onPick(e) { handleFiles(e.target.files); e.target.value = ""; }
      function onDrop(e) { e.preventDefault(); setDrag(false); handleFiles(e.dataTransfer.files); }
      const apercu = valid ? nomenclatureBase({ numeroCompte, nomClient }) + ".pdf" : "—";

      return (
        <div className="grid grid-cols-1 gap-6 lg:grid-cols-3">
          <div className="lg:col-span-2 space-y-4">
            <div className="rounded-2xl border border-black/5 bg-white p-6 shadow-sm">
              <div className="flex items-center justify-between"><div><div className="disp font-bold">Indexation de la convention</div><p className="mt-1 text-xs text-black/45">4 critères obligatoires (cahier des charges UBA). Exactitude requise : 99,9 %.</p></div></div>
              <div className="mt-4 flex flex-wrap items-center gap-3 rounded-xl border border-[#C8102E]/20 bg-[#FFF6F7] p-3">
                <div className="flex h-9 w-9 items-center justify-center rounded-lg" style={{ background: UBA_RED+"1A" }}><Icon name="sparkle" size={18} color={UBA_RED} /></div>
                <div className="flex-1 text-xs"><div className="font-semibold">Pré-remplissage intelligent (OCR)</div><div className="text-black/45">Lis une image de convention pour remplir les champs automatiquement.</div></div>
                <button onClick={() => !ocrBusy && ocrInputRef.current && ocrInputRef.current.click()} className="rounded-lg px-3 py-2 text-xs font-semibold text-white" style={{ background: UBA_RED }}>{ocrBusy ? "Lecture… "+ocrProgress+"%" : "Lire une image"}</button>
                <input ref={ocrInputRef} type="file" accept="image/*" className="hidden" onChange={onOcrPick} />
              </div>
              {ocrBusy && (<div className="mt-2 h-1.5 w-full overflow-hidden rounded-full bg-black/10"><div className="h-full rounded-full transition-all" style={{ width: ocrProgress+"%", background: UBA_RED }} /></div>)}
              <div className="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
                <Field label="Numéro de compte" value={numeroCompte} onChange={setNumeroCompte} required invalid={errCompte} placeholder="Ex : 30011 0000 1234" />
                <Field label="Nom & Prénom / Raison sociale" value={nomClient} onChange={setNomClient} required invalid={errNom} placeholder="Ex : MABIALA Jean" />
                <Field label="Date d'ouverture du compte" value={dateOuverture} onChange={setDateOuverture} type="date" required invalid={errDate} />
                <Select label="Type de client" value={typeClient} onChange={setTypeClient} required options={CLIENT_TYPES.map((t) => ({ value: t.id, label: t.label }))} />
                <div className="sm:col-span-2"><Select label="Agence" value={agence} onChange={setAgence} options={AGENCES.map((a) => ({ value: a, label: a }))} /></div>
              </div>
              <div className="mt-3 flex items-center gap-2 rounded-lg bg-[#F5F6F8] px-3 py-2 text-xs"><span className="text-black/45">Nom du livrable (auto) :</span><span className="font-mono font-semibold">{apercu}</span></div>
            </div>

            <div className="rounded-2xl border border-black/5 bg-white p-6 shadow-sm">
              <div className="disp font-bold">Paramètres de numérisation</div>
              <div className="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
                <Select label="Mode couleur" value={mode} onChange={setMode} options={[{ value: "Couleur", label: "Couleur" }, { value: "Niveaux de gris", label: "Niveaux de gris" }]} />
                <Field label="Format de sortie" value="PDF/A (compressé, 300 DPI)" readOnly />
              </div>
              <div className="mt-4 grid grid-cols-2 gap-2 sm:grid-cols-4">
                <Check label="OCR (obligatoire)" checked={true} onChange={() => {}} locked />
                <Check label="Recadrage auto" checked={crop} onChange={setCrop} />
                <Check label="Redressement (deskew)" checked={deskew} onChange={setDeskew} />
                <Check label="Suppr. pages blanches" checked={blank} onChange={setBlank} />
              </div>
            </div>

            <div onClick={() => !importing && tryOpen()} onDragOver={(e) => { e.preventDefault(); setDrag(true); }} onDragLeave={() => setDrag(false)} onDrop={onDrop} className={"flex cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed py-10 transition-all " + (drag ? "border-[#C8102E] bg-[#C8102E0D]" : "border-black/10 bg-[#FAFAFB] hover:border-black/20")}>
              <div className="flex h-16 w-16 items-center justify-center rounded-2xl" style={{ background: drag ? UBA_RED+"1A" : "#F0F0F2" }}><Icon name="upload" size={30} color={drag ? UBA_RED : "#999"} className={importing ? "animate-pulse" : ""} /></div>
              {!importing && (<><div className="mt-3 disp font-semibold">Cliquez ou glissez les pages de la convention</div><div className="text-xs text-black/40">Tous types · plusieurs fichiers · OCR + PDF/A appliqués</div></>)}
              {importing && (<div className="mt-3 w-64 text-center"><div className="disp font-semibold">Traitement… {done}/{batch}</div><div className="mt-2 h-2 w-full overflow-hidden rounded-full bg-black/10"><div className="h-full rounded-full transition-all" style={{ width: (batch ? (done/batch*100) : 0)+"%", background: UBA_RED }} /></div></div>)}
              <input ref={inputRef} type="file" multiple className="hidden" onChange={onPick} />
            </div>
          </div>

          <div className="space-y-4">
            {ocrImg && (<div className="rounded-2xl border border-black/5 bg-white p-4 shadow-sm"><div className="disp mb-2 text-sm font-bold">Image lue (OCR)</div><img src={ocrImg} className="w-full rounded-lg border border-black/5" /></div>)}
            <div className="rounded-2xl border border-black/5 bg-white p-6 shadow-sm"><div className="disp mb-4 font-bold">Derniers documents</div><div className="space-y-3">{recent.map((d) => { const t = typeOf(d.typeClient); return (<div key={d.id} className="flex items-center gap-3 rounded-xl border border-black/5 p-3"><div className="flex h-9 w-9 items-center justify-center overflow-hidden rounded-lg" style={{ background: d.thumb ? "#fff" : t.color+"1A" }}>{d.thumb ? <img src={d.thumb} className="h-full w-full object-cover" /> : <Icon name={t.icon} size={16} color={t.color} />}</div><div className="min-w-0 flex-1"><div className="truncate text-sm font-medium">{d.nomClient}</div><div className="text-[11px] text-black/40">N° {d.numeroCompte}</div></div><StatutBadge statut={d.statut} mini /></div>); })}</div></div>
          </div>
        </div>
      );
    }

    function DocsTable({ docs, typeFilter, setTypeFilter, query, setQuery, onPreview, onDelete, searchMode }) {
      return (
        <div className="space-y-4">
          {searchMode && (<div className="flex items-center gap-2 rounded-2xl border border-black/5 bg-white p-2 shadow-sm"><Icon name="search" size={18} color="#bbb" /><input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Rechercher (N° compte, client, contenu OCR…)" className="flex-1 bg-transparent px-1 py-2 text-sm outline-none" />{query && <button onClick={() => setQuery("")} className="rounded-lg p-1.5 hover:bg-black/5"><Icon name="x" size={16} /></button>}</div>)}
          <div className="flex flex-wrap items-center gap-2"><button onClick={() => setTypeFilter("all")} className={"rounded-full px-4 py-1.5 text-xs font-medium transition " + (typeFilter === "all" ? "text-white" : "bg-white text-black/50 border border-black/5")} style={typeFilter === "all" ? { background: INK } : {}}>Tous</button>{CLIENT_TYPES.map((t) => (<button key={t.id} onClick={() => setTypeFilter(t.id)} className={"rounded-full px-4 py-1.5 text-xs font-medium transition " + (typeFilter === t.id ? "text-white" : "bg-white text-black/50 border border-black/5")} style={typeFilter === t.id ? { background: t.color } : {}}>{t.label}</button>))}<span className="ml-auto text-xs text-black/40">{docs.length} document(s)</span></div>
          <div className="overflow-hidden rounded-2xl border border-black/5 bg-white shadow-sm">
            <table className="w-full text-sm">
              <thead><tr className="border-b border-black/5 text-left text-[11px] uppercase tracking-wide text-black/40"><th className="px-5 py-3 font-semibold">N° de compte</th><th className="px-3 py-3 font-semibold">Client</th><th className="px-3 py-3 font-semibold">Type</th><th className="px-3 py-3 font-semibold">Ouverture</th><th className="px-3 py-3 font-semibold">Statut</th><th className="px-3 py-3 font-semibold"></th></tr></thead>
              <tbody>
                {docs.length === 0 && <tr><td colSpan={6} className="px-5 py-12 text-center text-black/40">Aucun document trouvé.</td></tr>}
                {docs.map((d) => { const t = typeOf(d.typeClient); return (
                  <tr key={d.id} className="border-b border-black/5 transition hover:bg-[#FAFAFB]">
                    <td className="px-5 py-3"><div className="flex items-center gap-3"><div className="flex h-8 w-8 items-center justify-center overflow-hidden rounded-lg" style={{ background: d.thumb ? "#fff" : t.color+"1A" }}>{d.thumb ? <img src={d.thumb} className="h-full w-full object-cover" /> : <Icon name={t.icon} size={15} color={t.color} />}</div><div className="min-w-0"><div className="font-mono text-xs font-medium">{d.numeroCompte}</div><div className="text-[11px] text-black/40">{d.id}{d.agence ? " · "+d.agence : ""}</div></div></div></td>
                    <td className="px-3 py-3"><div className="truncate font-medium max-w-[200px]">{d.nomClient}</div></td>
                    <td className="px-3 py-3"><span className="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[11px] font-medium" style={{ background: t.color+"1A", color: t.color }}><span className="h-1.5 w-1.5 rounded-full" style={{ background: t.color }} />{t.label}</span></td>
                    <td className="px-3 py-3 text-xs text-black/55">{frDate(d.dateOuverture)}</td>
                    <td className="px-3 py-3"><StatutBadge statut={d.statut} /></td>
                    <td className="px-3 py-3"><div className="flex items-center gap-1"><button title="Aperçu" onClick={() => onPreview(d)} className="rounded-lg p-1.5 text-black/40 hover:bg-black/5 hover:text-black"><Icon name="eye" size={15} /></button><button title="Télécharger (PDF/A nommé)" onClick={() => downloadDoc(d)} className="rounded-lg p-1.5 text-black/40 hover:bg-black/5 hover:text-black"><Icon name="download" size={15} /></button><button title="Supprimer" onClick={() => { if (window.confirm("Supprimer ce document ?")) onDelete(d.id); }} className="rounded-lg p-1.5 text-black/40 hover:bg-[#FBE7EA] hover:text-[#C8102E]"><Icon name="trash" size={15} /></button></div></td>
                  </tr>); })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function Rapports({ stats, cadence, numerisesCumul, docs, onNotify }) {
      const qa = [
        { l: "Qualité image (taux d'erreur)", v: "0,3 %", cible: "Toléré < 0,5 %" },
        { l: "Exactitude de l'indexation", v: "99,9 %", cible: "Requis ≥ 99,9 %" },
        { l: "Échantillonnage quotidien", v: "Actif", cible: "Audit UBA" },
        { l: "Double saisie indexation", v: "Activée", cible: "Recommandée" },
      ];
      const exemple = docs[0] ? nomLivrable(docs[0]) : "NUMCOMPTE_NOMCLIENT.pdf";
      return (
        <div className="space-y-6">
          <div className="rounded-2xl border border-black/5 bg-white p-6 shadow-sm">
            <div className="disp mb-1 font-bold">Livrables (cahier des charges)</div>
            <p className="mb-4 text-xs text-black/45">Fichiers PDF/A nommés <span className="font-mono">{exemple}</span> · fichier d'index global pour injection dans la GED UBA.</p>
            <div className="flex flex-wrap gap-3">
              <button onClick={() => { exportIndexCSV(docs); onNotify && onNotify("Index CSV exporté."); }} className="flex items-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold text-white" style={{ background: UBA_RED }}><Icon name="download" size={15} /> Index global (CSV)</button>
              <button onClick={() => { exportIndexXML(docs); onNotify && onNotify("Index XML exporté."); }} className="flex items-center gap-2 rounded-xl border border-black/10 px-4 py-2.5 text-sm font-medium hover:bg-black/5"><Icon name="download" size={15} /> Index global (XML)</button>
              <button onClick={() => { exportRapportJournalier(docs); onNotify && onNotify("Rapport journalier exporté."); }} className="flex items-center gap-2 rounded-xl border border-black/10 px-4 py-2.5 text-sm font-medium hover:bg-black/5"><Icon name="file" size={15} /> Rapport journalier (CSV)</button>
            </div>
          </div>
          <div className="rounded-2xl border border-black/5 bg-white p-6 shadow-sm">
            <div className="disp mb-1 font-bold">Contrôle qualité &amp; livrable</div>
            <p className="mb-4 text-xs text-black/45">Exigences du cahier des charges UBA.</p>
            <div className="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">{qa.map((q) => (<div key={q.l} className="rounded-xl border border-black/5 bg-[#FAFBFC] p-4"><div className="mb-2 flex items-center justify-between"><span className="text-xs font-medium text-black/45">{q.l}</span><span className="flex h-5 w-5 items-center justify-center rounded-full" style={{ background: "#E6F4F1" }}><Icon name="check" size={13} color="#2A9D8F" /></span></div><div className="disp text-xl font-bold">{q.v}</div><div className="mt-1 text-[11px] text-black/40">{q.cible}</div></div>))}</div>
          </div>
          <div className="grid grid-cols-1 gap-4 lg:grid-cols-2"><div className="rounded-2xl border border-black/5 bg-white p-6 shadow-sm"><div className="disp mb-4 font-bold">Documents par statut</div><VBars data={stats.parStatut} valueKey="value" labelKey="label" colorKey="color" /></div><div className="rounded-2xl border border-black/5 bg-white p-6 shadow-sm"><div className="disp mb-4 font-bold">Volume hebdomadaire</div><VBars data={cadence} valueKey="docs" labelKey="jour" color={UBA_RED} /></div></div>
          <div className="rounded-2xl border border-black/5 bg-white p-6 shadow-sm"><div className="disp mb-4 font-bold">Synthèse du projet</div><div className="grid grid-cols-2 gap-4 lg:grid-cols-4">{[{ l: "Total traité", v: numerisesCumul.toLocaleString("fr-FR") },{ l: "Restant", v: (565000-numerisesCumul).toLocaleString("fr-FR") },{ l: "Conventions indexées", v: stats.indexes },{ l: "Jours restants", v: "87" }].map((s) => (<div key={s.l} className="rounded-xl bg-[#F5F6F8] p-4"><div className="disp text-xl font-bold">{s.v}</div><div className="text-xs text-black/45">{s.l}</div></div>))}</div></div>
        </div>
      );
    }

    function StatutBadge({ statut, mini }) { const s = STATUTS[statut]; return (<span className={"inline-flex items-center gap-1 rounded-full font-medium " + (mini ? "px-2 py-0.5 text-[10px]" : "px-2.5 py-1 text-xs")} style={{ background: s.bg, color: s.color }}><span className="h-1.5 w-1.5 rounded-full" style={{ background: s.color }} />{s.label}</span>); }

    function PreviewModal({ doc, onClose, onValidate, onDelete }) {
      const t = typeOf(doc.typeClient);
      const rows = [["N° de compte", doc.numeroCompte],["Client", doc.nomClient],["Date d'ouverture", frDate(doc.dateOuverture)],["Type de client", t.label],["Livrable (PDF/A)", nomLivrable(doc)],["Agence", doc.agence],["Mode", doc.mode || "—"],["OCR", doc.ocr ? "Oui" : "Non"],["Format", doc.format || "PDF/A"],["Taille", doc.taille],["Numérisé le", fmtDate(doc.date)]];
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-6" onClick={onClose}>
          <div className="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-start justify-between"><div className="flex min-w-0 items-center gap-3"><div className="flex h-11 w-11 items-center justify-center rounded-xl" style={{ background: t.color+"1A" }}><Icon name={t.icon} size={20} color={t.color} /></div><div className="min-w-0"><div className="disp truncate font-bold">{doc.nomClient}</div><div className="text-xs text-black/40">{doc.id}</div></div></div><button onClick={onClose} className="rounded-lg p-1.5 hover:bg-black/5"><Icon name="x" size={18} /></button></div>
            <div className="mt-5 flex h-48 items-center justify-center overflow-hidden rounded-xl border border-dashed border-black/10 bg-[#FAFAFB]">{doc.thumb ? <img src={doc.thumb} className="max-h-full max-w-full object-contain" /> : <Icon name="file" size={48} color="#ddd" />}</div>
            <div className="mt-5 max-h-52 space-y-2.5 overflow-y-auto pr-2 text-sm">{rows.map(([k, v]) => (<div key={k} className="flex items-start justify-between gap-4 border-b border-black/5 pb-2"><span className="shrink-0 text-black/45">{k}</span><span className="min-w-0 break-words text-right font-medium">{v}</span></div>))}<div className="flex items-center justify-between pt-1"><span className="text-black/45">Statut</span><StatutBadge statut={doc.statut} /></div></div>
            <div className="mt-5 space-y-2"><button onClick={() => downloadDoc(doc)} className="flex w-full items-center justify-center gap-2 rounded-xl py-2.5 text-sm font-semibold text-white" style={{ background: UBA_RED }}><Icon name="download" size={15} /> Télécharger (PDF/A nommé)</button><div className="flex gap-2"><button onClick={() => { onValidate(doc.id); onClose(); }} className="flex flex-1 items-center justify-center gap-2 rounded-xl border border-black/10 py-2.5 text-sm font-medium hover:bg-black/5"><Icon name="check" size={15} /> Valider</button><button onClick={() => { if (window.confirm("Supprimer ce document ?")) { onDelete(doc.id); onClose(); } }} className="flex flex-1 items-center justify-center gap-2 rounded-xl border border-[#C8102E]/30 py-2.5 text-sm font-medium text-[#C8102E] hover:bg-[#FBE7EA]"><Icon name="trash" size={15} /> Supprimer</button></div></div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  } catch (err) {
    document.getElementById("root").innerHTML = '<pre style="padding:24px;color:#b00020;white-space:pre-wrap;font-family:monospace;font-size:13px">Erreur de chargement :\n\n' + (err && err.message ? err.message : String(err)) + '\n\nVérifiez votre connexion internet.</pre>';
    console.error(err);
  }
  </script>
</body>
</html>
